name: Validate production pipeline
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
    paths: ['scripts/**', 'tests/**', 'config/**', 'prompts/**', 'templates/**', 'design/**', 'AGENTS.md', 'SPEC-v1.md', 'requirements.txt', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolate fixture acceptance on a local development branch
        run: git switch -c codex/ci-verification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.3
      - run: python scripts/validate_configuration.py
      - run: python -m pytest -q -p no:cacheprovider
        env:
          DRAGON_RENDER_SMOKE: '1'
