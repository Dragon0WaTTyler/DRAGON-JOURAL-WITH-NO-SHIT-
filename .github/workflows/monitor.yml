name: Monitor DRAGON daily completion
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional Casablanca date YYYY-MM-DD'
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify today after the production deadline
        env:
          EDITION_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$EDITION_DATE" ]; then
            python scripts/audit_daily_run.py --date "$EDITION_DATE"
          else
            python scripts/audit_daily_run.py
          fi
