name: Validate current-news handoff

on:
  push:
    branches: [main]
    paths:
      - 'daily-runs/**/current-news.json'
      - 'daily-runs/**/status.json'
      - 'scripts/current_news_handoff.py'
      - '.github/workflows/current-news-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate today's current-news handoff
        shell: bash
        run: |
          edition_date=$(TZ=Africa/Casablanca date +%F)
          file="daily-runs/${edition_date}/current-news.json"
          if [ ! -f "$file" ]; then
            echo "No current-news handoff is present for ${edition_date}."
            exit 0
          fi
          echo "Validating $file"
          python scripts/current_news_handoff.py "$file"
