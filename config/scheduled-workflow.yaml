version: 1
contract: future-chatgpt-scheduled-work-orchestration
enabled: false
activation: contract-only-no-scheduled-task-created
timezone: Africa/Casablanca

# This is a future orchestration contract. It does not enable config/schedule.yaml
# and it does not create a recurring task in ChatGPT.
scheduling:
  current_mode: manual-cloud-run-only
  schedule_config: config/schedule.yaml
  schedule_config_required_enabled: false
  target_future_time: "10:00"
  activation_requirements:
    - native-hosted-codex-cloud-scheduled-work-is-available
    - pc-off-acceptance-test-passes
    - text-and-binary-persistence-behavior-is-tested

execution_constraints:
  subscription: chatgpt-plus
  execution_environment: hosted-codex-cloud
  openai_api_allowed: false
  openai_api_key_required: false
  pay_as_you_go_openai_allowed: false
  github_actions_allowed: false
  external_paid_services_allowed: false
  self_hosted_runner_allowed: false
  local_pc_dependency_allowed: false
  github_role: source-control-persistent-memory-edition-archive-artifacts

production_state:
  status_path: daily-runs/YYYY-MM-DD/status.json
  fresh_run_initialization:
    operation: reset-before-any-stage-starts
    values:
      current_research: PENDING
      deep_research: PENDING
      editorial: PENDING
      publishing: PENDING
      cover: PENDING
      overall_status: PENDING
      blocking_reason: null
    remove_stale_completion_fields: true
    rule: Never inherit COMPLETE from smoke, pre-production, deleted-edition, or abandoned same-date state.
  resume:
    explicit_only: true
    require_remote_read_back_before_retaining_complete: true
    required_remote_paths_must_be_exact: true
  invariants:
    editorial_complete_requires:
      - current_research == COMPLETE
      - deep_research == COMPLETE
      - local editions/YYYY/MM/YYYY-MM-DD/edition.md exists
      - local editions/YYYY/MM/YYYY-MM-DD/sources.json exists
      - local editions/YYYY/MM/YYYY-MM-DD/manifest.json exists
      - exact remote read-back of edition.md, sources.json, and manifest.json
      - required editorial gates pass
    publishing_running_or_complete_requires: editorial == COMPLETE
    publishing_complete_requires:
      - required text and binary artifacts exist
      - artifact validation passes
      - exact remote read-back corresponds to the current run
    cover_complete_requires:
      - editorial == COMPLETE
      - cover.webp exists
      - cover validation passes
      - exact remote read-back corresponds to the current run
    overall_complete_requires: every required production stage is legitimately COMPLETE
    downstream_reset_rule: If editorial is BLOCKED or FAILED, publishing and cover must not remain COMPLETE for that attempt.

remote_persistence:
  local_or_runtime_file_is_not_remote_persistence: true
  pass_requires:
    - write through connected GitHub persistence path
    - read exact canonical remote path back
    - confirm returned content or artifact corresponds to the just-written output
  chief_editor_required_read_back:
    - editions/YYYY/MM/YYYY-MM-DD/edition.md
    - editions/YYYY/MM/YYYY-MM-DD/sources.json
    - editions/YYYY/MM/YYYY-MM-DD/manifest.json
  report_rule: editorial-report.json and publishing-report.json must not claim PASS before the exact read-back check.

# These are five coordinating super-jobs over the authoritative 13 roles in
# config/roles.yaml. They are not five replacement editorial roles.
jobs:
  - id: current-news-desk
    task_number: 1
    label: CURRENT NEWS DESK
    local_time: "07:45"
    timezone: Africa/Casablanca
    editorial_roles: [morocco, meknes, palestine, world, ai]
    reads:
      - memory/
      - previous-edition
      - ongoing-stories
      - config/sources.yaml
      - config/output-schema.json
    responsibilities:
      - read repository memory and the previous edition before selecting work
      - avoid unnecessary repetition and report only meaningful new developments
      - perform fresh live research in hosted Codex Cloud
      - create structured research packets, not final newspaper prose
      - verify major claims and preserve source URLs and provenance
      - distinguish facts, claims, estimates, disputed claims, and unknowns
    outputs:
      - path: daily-runs/YYYY-MM-DD/current-news.json
        kind: text
        format: structured-research-packets
    completion:
      status_field: current_research
      complete_value: COMPLETE
      rule: Set COMPLETE only when all required research is responsibly finished; otherwise use BLOCKED or FAILED.
    forbidden:
      - write-the-final-newspaper
      - invent-missing-research

  - id: deep-features-desk
    task_number: 2
    label: DEEP FEATURES DESK
    local_time: "08:00"
    timezone: Africa/Casablanca
    editorial_roles: [science, history, literature-culture, investigations]
    reads:
      - memory/
      - investigations/
      - config/editorial-depth.yaml
      - config/sources.yaml
      - config/output-schema.json
    responsibilities:
      - read memory before topic selection and avoid recently repeated topics
      - research Science, History, Literature/Culture, and Investigations deeply
      - keep History at a hard minimum of 800 words and target 1000-1500
      - keep Literature/Culture at a hard minimum of 800 words and target 1000-1500
      - allow investigations to remain RESEARCHING and never force publication
      - preserve study methodology, publication status, limitations, and uncertainty
      - write structured research packets and feature material only
    outputs:
      - path: daily-runs/YYYY-MM-DD/deep-features.json
        kind: text
        format: structured-research-packets
    completion:
      status_field: deep_research
      complete_value: COMPLETE
      rule: Set COMPLETE only when responsible research is complete; an unresolved dossier remains explicitly RESEARCHING or BLOCKED.
    forbidden:
      - write-the-final-newspaper
      - force-an-investigation-to-ready
      - lower-editorial-depth-minimums

  - id: chief-editor
    task_number: 3
    label: CHIEF EDITOR
    local_time: "08:50"
    timezone: Africa/Casablanca
    editorial_roles: [chief-editor, fact-check, darija-editor]
    prerequisites:
      all:
        - current_research == COMPLETE
        - deep_research == COMPLETE
      if_not_met: STOP; do not invent missing research or produce a fake edition.
    reads:
      - daily-runs/YYYY-MM-DD/current-news.json
      - daily-runs/YYYY-MM-DD/deep-features.json
      - memory/
      - investigations/
      - config/editorial-depth.yaml
      - config/quality-gates.yaml
      - config/sources.yaml
    responsibilities:
      - combine and rank research packets
      - remove duplication and select front-page priorities
      - request only evidence-based follow-ups
      - apply editorial-depth rules and the Morocco accountability doctrine
      - fact-check claims, numbers, dates, attributions, and citations
      - perform natural Moroccan Darija Latin editorial cleanup
      - remove internal engineering prose from reader-facing copy
      - update editorial memory and ongoing stories
      - write one coherent newspaper
    outputs:
      - path: daily-runs/YYYY-MM-DD/editorial-report.json
        kind: text
      - path: editions/YYYY/MM/YYYY-MM-DD/edition.md
        kind: text
      - path: editions/YYYY/MM/YYYY-MM-DD/sources.json
        kind: text
      - path: editions/YYYY/MM/YYYY-MM-DD/manifest.json
        kind: text
    completion:
      status_field: editorial
      complete_value: COMPLETE
      rule: Set COMPLETE only after editorial, factual, depth, language, and citation gates pass.

  - id: publishing-desk
    task_number: 4
    label: PUBLISHING DESK
    local_time: "09:25"
    timezone: Africa/Casablanca
    editorial_roles: [publishing]
    prerequisites:
      all:
        - editorial == COMPLETE
      if_not_met: STOP; preserve successful research and edition text.
    reads:
      - editions/YYYY/MM/YYYY-MM-DD/edition.md
      - editions/YYYY/MM/YYYY-MM-DD/sources.json
      - config/edition-manifest-schema.json
      - config/execution-constraints.yaml
      - config/quality-gates.yaml
      - design/DRAGON-COVER-STYLE.md
    responsibilities:
      - generate PDF and EPUB from canonical edition.md
      - apply the V1.1 reader-facing publishing rules
      - keep UTF-8 clean, with zero mojibake and zero Arabic script
      - enforce strict EPUB XHTML/XML parsing, TOC, navigation, and links
      - make source links clickable and preserve source provenance
      - produce a readable newspaper-style PDF, not a Markdown-print layout
      - render and visually inspect PDF pages before accepting artifacts
      - validate every artifact and record actual persistence behavior
    outputs:
      - path: editions/YYYY/MM/YYYY-MM-DD/edition.pdf
        kind: binary
      - path: editions/YYYY/MM/YYYY-MM-DD/edition.epub
        kind: binary
      - path: daily-runs/YYYY-MM-DD/publishing-report.json
        kind: text
    persistence:
      text: TEXT_PERSISTENCE
      binary: BINARY_PERSISTENCE
    completion:
      status_field: publishing
      complete_value: COMPLETE
      rule: Set COMPLETE only when the required artifact validation and the actual available persistence behavior both pass; blocked binary persistence is not PASS.

  - id: cover-director
    task_number: 5
    label: COVER DIRECTOR
    local_time: "09:55"
    timezone: Africa/Casablanca
    editorial_roles: [publishing]
    prerequisites:
      all:
        - editorial == COMPLETE
      preferred:
        - publishing == COMPLETE
      if_not_met: Do not fabricate content; use only the final edition and its sources.
    reads:
      - editions/YYYY/MM/YYYY-MM-DD/edition.md
      - editions/YYYY/MM/YYYY-MM-DD/sources.json
      - design/DRAGON-COVER-STYLE.md
    responsibilities:
      - identify the lead story, defensible editorial angle, emotional tone, and 3-5 teasers
      - include a Tarikh or Adab teaser where it belongs
      - create a cover brief without researching unrelated stories
      - generate one DRAGON cover under the permanent art-direction contract
      - use Darija Latin for ordinary visible cover text and never use Arabic script
      - label generated visuals as editorial illustration, never documentary evidence
    outputs:
      - path: daily-runs/YYYY-MM-DD/cover-brief.json
        kind: text
      - path: editions/YYYY/MM/YYYY-MM-DD/cover.webp
        kind: binary
    persistence:
      text: TEXT_PERSISTENCE
      binary: BINARY_PERSISTENCE
    completion:
      status_field: cover
      complete_value: COMPLETE
      rule: Set COMPLETE only when cover generation and the actual required persistence step succeed.

daily_status:
  path: daily-runs/YYYY-MM-DD/status.json
  fields:
    - date
    - timezone
    - current_research
    - deep_research
    - editorial
    - publishing
    - cover
    - overall_status
    - last_updated
    - blocking_reason
  allowed_stage_values: [PENDING, RUNNING, COMPLETE, BLOCKED, FAILED]
  initial_values:
    current_research: PENDING
    deep_research: PENDING
    editorial: PENDING
    publishing: PENDING
    cover: PENDING
    overall_status: PENDING
  overall_completion_rule: overall_status may be COMPLETE only when all required stages supported by the current architecture are COMPLETE; a blocked binary persistence stage cannot be silently treated as PASS.

failure_and_handoff:
  task_1_or_2_failure: Chief Editor must not fabricate missing research.
  chief_editor_failure: Publishing must not create a fake final edition.
  publishing_failure: Preserve edition.md and successful research; retry only the failed publishing artifact or persistence step.
  cover_failure: Newspaper content remains valid; retry only the cover stage.
  github_text_write_failure: The affected stage is NOT COMPLETE.
  binary_connector_limitation: Mark the exact limitation in status and reports; never fake binary persistence.
  quality_gates: No task may weaken a quality gate merely to finish on time.
  retry_scope: Retry only the failed stage or artifact when safe; do not rerun all research unnecessarily.

connector_capabilities:
  github_scheduled_text_read: PASS
  github_scheduled_utf8_text_write: PASS
  github_scheduled_text_read_back: PASS
  github_binary_image_write_through_current_connector: UNSUPPORTED/BLOCKED
  scheduled_image_generation: UNTESTED
  binary_persistence_rule: Binary outputs must be marked BLOCKED or NOT COMPLETE until the current connector's real capability is tested and succeeds.

artifact_persistence:
  text_persistence: Store canonical text, JSON reports, manifests, memory, and provenance in GitHub after gates.
  binary_persistence: Do not claim edition.pdf, edition.epub, or cover.webp persisted through the current GitHub connector unless an actual supported write and read-back succeeds.
  github_actions: forbidden
  api_infrastructure: forbidden
  local_pc_runtime: forbidden
