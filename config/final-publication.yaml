version: 2
status_field: final_publication_status
allowed_values:
- PENDING
- BLOCKED
- COMPLETE
initial_value: PENDING
source_package:
  required_status: COMPLETE
  required_files:
  - edition.html
  - print.css
  - epub-content.xhtml
cover:
  accepted_types:
  - AI_GENERATED
  - SVG_FALLBACK
  required:
  - cover == COMPLETE
  - visual_qa_status == PASS
  - exact canonical asset persisted/read back
  fallback_rule: SVG fallback is a valid editorial cover; image_generation_status
    remains truthful.
  failure_rule: BLOCK only when no valid archived canonical cover exists.
binaries:
  pdf:
    canonical_name: dragon-YYYY-MM-DD.pdf
    complete_state: GENERATED_VALIDATED
    required_checks:
    - non_zero_size
    - readable_pdf
    - page_count_at_least_2
    - canonical_cover_page_1
    - no_blank_interior_pages
    - canonical_prose_equivalence
  epub:
    canonical_name: dragon-YYYY-MM-DD.epub
    complete_state: GENERATED_VALIDATED
    required_checks:
    - non_zero_size
    - valid_zip
    - mimetype_first_uncompressed
    - valid_container_xml
    - valid_opf_xml
    - valid_nav_xhtml
    - canonical_cover_metadata
  combined_complete_state: COMPLETE
persistence:
  final_complete_requires_github_binary_persistence: true
  final_complete_requires_exact_path_read_back: true
  temporary_runtime_binary_is_not_published: true
final_complete_requires:
- publication_source_package == COMPLETE
- cover == COMPLETE
- visual_qa_status == PASS
- pdf_binary == GENERATED_VALIDATED
- epub_binary == GENERATED_VALIDATED
- binary_artifacts == COMPLETE
- PDF exists at editions/YYYY/MM/YYYY-MM-DD/dragon-YYYY-MM-DD.pdf
- EPUB exists at editions/YYYY/MM/YYYY-MM-DD/dragon-YYYY-MM-DD.epub
- exact GitHub binary persistence/read-back PASS
- canonical cover_asset_type is AI_GENERATED or SVG_FALLBACK
- binary hashes match exact GitHub read-back
- current canonical input hashes match render receipt
status_semantics:
  publishing_COMPLETE: PUBLICATION_SOURCE_PACKAGE_COMPLETE_ONLY
  overall_status_rule: Keep overall_status PENDING or BLOCKED until final_publication_status
    == COMPLETE. Do not use overall_status COMPLETE as a synonym for scheduled-stage
    completion.
  scheduled_stage_summary: The five scheduled stages may all be individually COMPLETE
    while overall_status remains PENDING because final binary publication is still
    pending.
manual_renderer:
  script: scripts/render_production_binaries.py
  command: python scripts/render_production_binaries.py --date YYYY-MM-DD
  result: local structural validation only; never final publication COMPLETE
automatic_publisher:
  script: scripts/auto_publish.py
  workflow: .github/workflows/publish.yml
  quality_semantics: Automated source/structure checks plus Task 4 cover visual QA;
    renderer does not claim human PDF visual review.
