version: 4
gates:
  research:
    required:
    - research_packets
    - source_records
    - uncertainty_labels
  verification:
    required:
    - attributed_material_claims
    - contradictory_evidence_review
  accountability:
    required:
    - evidence_for_accusations
    - evidence_against_hypothesis_review
  depth:
    required:
    - editorial_depth_policy
    - total_word_minimum
    - history_hard_minimum
    - literature_culture_hard_minimum
    - morocco_hard_minimum
    - science_hard_minimum
    - meknes_exception_or_minimum
  newspaper_architecture:
    required:
    - edition_plan_before_reader_prose
    - complete_section_inventory_or_skip_reasons
    - morocco_world_life_accountability_coverage
    - edition_wide_lead_brief_long_form_mix
    - varied_reader_facing_article_formats
    - narrative_paragraph_minimums
    - no_legacy_briefing_card_in_articles
    - plan_to_html_semantic_article_mapping
    - flexible_page_budget_no_content_truncation
  language:
    required:
    - darija_latin
    - zero_arabic_script
    - deterministic_arabic_scan_repair_rescan
  citations:
    required:
    - claim_source_traceability
  scheduled_publication_source:
    required:
    - edition_html
    - print_css
    - epub_content_xhtml
    - utf8
    - no_mojibake
    - zero_arabic_script
    - resolved_source_links
    - github_text_read_back
    - edition_plan_lineage_when_version_4
  scheduled_cover:
    required:
    - compact_cover_brief
    - one_dominant_concept
    - canonical_cover_persisted
    - visual_qa_pass
    - max_one_retry
    - zero_arabic_script
    - truthful_cover_type
  manual_binary_render:
    required:
    - pdf_render
    - epub_render
    - binary_validation
    scheduled_work_required: false
  final_publication:
    required:
    - publication_source_package_complete
    - cover_visual_qa_pass
    - pdf_generated_validated
    - epub_generated_validated
    - binary_artifacts_complete
    - canonical_binary_paths
    - github_binary_persistence_read_back
    - canonical_cover_pass
    - canonical_input_hashes
    complete_status: COMPLETE
    fail_closed: true
  archive:
    required:
    - github_text_read_back
    binary_archive_required_for_final_publication_complete: true
  editorial_quality_report:
    required:
    - total_word_count
    - per_section_word_counts
    - hard_minimums
    - target_ranges
    - allowed_exceptions
    - repeated_topic_check
    - regeneration_requests
    - arabic_script_count
  workflow_state:
    required:
    - fresh_run_initialization
    - dependency_invariants
    - binary_state_visibility
    - report_consistency
    - downstream_reset_on_block
    - final_publication_status_visibility
blocking_statuses:
- FAIL
- FIX
- REMOVE
- NOT_COMPLETE
- BLOCKED
