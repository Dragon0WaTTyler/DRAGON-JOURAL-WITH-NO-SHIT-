version: 5
authority: SPEC-v5.md
mode: build-behind
timezone: Africa/Casablanca
primary_runtime: local-windows
entry_point: dragon_daily.py
scheduler:
  entries: 1
  provider: windows-task-scheduler
  enabled: false
  task_name: DRAGON V5 Daily Newspaper
  start_time: "07:00"
  target_deadline: "10:30"
  watchdog_interval_minutes: 15
orchestrator:
  instances: 1
  state_path: daily-runs/YYYY-MM-DD/state.json
  lock_path: daily-runs/YYYY-MM-DD/run.lock
  atomic_state_writes: true
  preserve_historical_status: true
  stages:
    - preflight
    - research
    - article_generation
    - chief_editor
    - factcheck
    - arabic_language_qa
    - cover
    - publication_source
    - pdf
    - epub
    - final_qa
    - github_archive
    - whatsapp_delivery
preflight:
  expected_remote_contains: DRAGON-JOURAL-WITH-NO-SHIT-
  expected_branch: main
  require_clean_worktree: true
  minimum_python: [3, 12]
  minimum_free_bytes: 536870912
  required_modules:
    - yaml
    - jsonschema
    - pypdf
    - markdown_it
    - PIL
    - arabic_reshaper
    - bidi
  network_probe:
    enabled: true
    host: github.com
    port: 443
    timeout_seconds: 5
  require_ai_provider: true
watchdog:
  default_stage_timeout_seconds: 7200
  stage_timeouts_seconds:
    preflight: 600
    research: 7200
    article_generation: 7200
    chief_editor: 3600
    factcheck: 3600
    arabic_language_qa: 1800
    cover: 1800
    publication_source: 1200
    pdf: 1200
    epub: 1200
    final_qa: 1200
    github_archive: 900
    whatsapp_delivery: 900
publication:
  language: ar
  direction: rtl
  byline_template: "تحرير: {pen_name}"
  pen_name: DRAGON
  local_completion_requires:
    - editorial_complete
    - factcheck_pass
    - arabic_language_qa_pass
    - canonical_cover_accepted
    - pdf_pass
    - epub_pass
    - final_qa_pass
  archive_status_is_independent: true
  delivery_status_is_independent: true
providers:
  ai:
    type: unconfigured
    paid_service_auto_enable: false
    integration_test_status: NOT_RUN
  repair:
    type: unconfigured
    available_only_after_integration_test: true
    integration_test_status: NOT_RUN
  github_archive:
    type: git-cli
    enabled: false
    remote: origin
    branch: main
  whatsapp:
    type: unconfigured
    enabled: false
    integration_test_status: NOT_RUN
    graph_version: ""
    access_token_env: META_WHATSAPP_ACCESS_TOKEN
    phone_number_id_env: META_WHATSAPP_PHONE_NUMBER_ID
    recipients_env: DRAGON_WHATSAPP_RECIPIENTS
cutover:
  legacy_v4_fallback_enabled: true
  local_scheduler_enabled: false
  competing_github_production_disabled: false
  acceptance_evidence_required: true
