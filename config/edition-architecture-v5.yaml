front_page:
  duplicate_full_lead_prose: false
pagination:
  fixed_page_count: false
  overflow_rule: add_pages_before_cutting_verified_editorial_prose

# V5 keeps the inherited V4 coverage minima, but gives ``reader_life`` its
# editorial meaning rather than treating it as a narrow legacy desk label.
# Education, health, technology, science, sport, culture and reader service
# are all legitimate reader-value reporting.  The minimum remains two
# distinct, evidence-eligible events; this only prevents a supported education
# or service item from being invisible to the reader-value gate.
editorial_readiness:
  coverage_rule_overrides:
    reader_life:
      sections: [ta3lim, se77a, technology, science, sport, culture, service]
